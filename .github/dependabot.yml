version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "ng-packagr"
          - "zone.js"
      kendo:
        patterns:
          - "@progress/*"
      lint-and-format:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"
      test-tooling:
        patterns:
          - "karma"
          - "karma-*"
          - "jasmine-core"
          - "@types/jasmine"
      other:
        patterns:
          - "*"
    ignore:
      # Angular 22 pins typescript >=6.0 <6.1 via @angular/build,
      # @angular/compiler-cli and ng-packagr; typescript-eslint pins <6.1.0.
      # Drop this once Angular supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
